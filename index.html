<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container my-5">
        <h1 class="text-center mb-5 fw-bold text-primary">Library System</h1>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white fw-bold">Add New Book</div>
                    <div class="card-body">
                        <form id="bookForm">
                            <div class="mb-3">
                                <label for="bookTitle" class="form-label">Book Title</label>
                                <input type="text" class="form-control" id="bookTitle" required
                                    placeholder="e.g., Atomic Habits">
                            </div>
                            <div class="mb-3">
                                <label for="bookAuthor" class="form-label">Author</label>
                                <input type="text" class="form-control" id="bookAuthor" required
                                    placeholder="e.g., James Clear">
                            </div>
                            <div class="mb-3">
                                <label for="bookPubDate" class="form-label">Publication Date</label>
                                <input type="date" class="form-control" id="bookPubDate" required>
                            </div>
                            <button type="button" class="btn btn-primary w-100" onclick="addBook()">Add Book to
                                Library</button>
                        </form>
                    </div>
                </div>
            </div>


            <div class="col-md-7">
                <div class="card h-100">
                    <div class="card-header bg-dark text-white fw-bold">Record Book Borrowing</div>
                    <div class="card-body">
                        <form id="borrowForm">
                            <div class="mb-3">
                                <label class="form-label">Borrower's Name</label>
                                <input type="text" class="form-control" id="borrowerInput" placeholder="e.g., Joseph">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Select Book from Inventory</label>
                                <select class="form-select" id="borrowBookSelect">
                                    <option value="" disabled selected>Choose a book</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Date Borrowed</label>
                                    <input type="date" class="form-control" id="borrowDate">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Expected Return Date</label>
                                    <input type="date" class="form-control" id="returnDate">
                                </div>
                            </div>

                            <button type="button" class="btn btn-dark w-100" onclick="addBorrow()">Save Borrow
                                Record</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-5">

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-success text-white fw-bold">Books Available</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Author</th>
                                        <th>Published</th>
                                    </tr>
                                </thead>
                                <tbody id="booksTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card">
                    <div class="card-header bg-dark text-white fw-bold">Active Borrow Logs</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Borrower</th>
                                        <th>Book Title</th>
                                        <th>Date Borrowed</th>
                                        <th>Due Date</th>
                                    </tr>
                                </thead>
                                <tbody id="borrowTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>


            <script>

                let books = [];
                let borrows = [];
                const addBook = () => {
                    let titleInput = bookTitle.value;
                    let authorInput = bookAuthor.value;
                    let pubDateInput = bookPubDate.value;
                    // console.log(titleInput);
                    // console.log(authorInput);
                    // console.log(pubDateInput);

                    if (titleInput === '' || authorInput === '' || pubDateInput === '') {
                        alert('Please fill out all fields before adding a book.')
                        // return;
                    } else {
                        let newBook = {
                            id: Date.now().toString(),
                            title: titleInput,
                            author: authorInput,
                            published: pubDateInput,
                        }
                        books.push(newBook)
                        bookTitle.value = '';
                        bookAuthor.value = '';
                        bookPubDate.value = '';
                    }
                    displayBooks();
                }

                const displayBooks = () => {
                    let booksTable = document.getElementById('booksTableBody');
                    booksTable.innerHTML = '';

                    // borrowBookSelect.innerHTML = '';
                    borrowBookSelect.innerHTML = `<option value="" disabled selected>Choose a book</option>`;

                    for (let i = 0; i < books.length; i++) {
                        let currentBook = books[i];
                        booksTable.innerHTML += `<tr>
                            <td><strong>${currentBook.title}</strong></td>
                            <td>${currentBook.author}</td>
                            <td>${currentBook.published}</td>
                            </tr>`;
                        borrowBookSelect.innerHTML += `<option value="${currentBook.title}">${currentBook.title}</option>`;
                    }

                }

                const addBorrow = () => {
                    let borrowerName = borrowerInput.value;
                    let selectedBook = borrowBookSelect.value;
                    let startDate = borrowDate.value;
                    let endDate = returnDate.value;

                    if (borrowerName === '' || selectedBook === '' || startDate === '' || endDate === '') {
                        alert('Please fill out all borrowing fields.')
                        return;
                    }

                    let newBorrow = {
                        borrower: borrowerName,
                        bookTitle: selectedBook,
                        dateOut: startDate,
                        dateIn: endDate

                    }
                    borrows.push(newBorrow)

                    borrowForm.reset();

                    displayBorrow();
                }

                const displayBorrow = () => {
                    let borrowTable = document.getElementById('borrowTableBody')
                    borrowTable.innerHTML = ''

                    for (let i = 0; i < borrows.length; i++) {
                        let currentBorrow = borrows[i];

                        borrowTable.innerHTML += `<tr>
                            <td><strong>${currentBorrow.borrower}</strong></td>
                            <td><strong>${currentBorrow.bookTitle}</strong></td>
                            <td><span class="badge bg-secondary">${currentBorrow.dateOut}</span></td>
                            <td><span class="badge bg-danger">${currentBorrow.dateIn}</span></td>
                            
                            </tr>`;
                    }
                }
            </script>
</body>


<!-- Assignment
Build a library system Let us be able to add books, with every necessary details like author, date etc On the same page, let's be able to keep record of book borrowing Someone comes to borrow a book, we open a drop-down of the book list, select the one they are borrowing, type date they borrowed it and the day they want to return it, then save it.  -->

</html>
